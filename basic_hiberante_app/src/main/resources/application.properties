spring.application.name=basic_hiberante_app
spring.datasource.url=jdbc:mysql://localhost:<db_name>/ems?useSSL=false
spring.datasource.username=<username>
spring.datasource.password=<password>

# Hibernate properties
spring.jpa.properties.hibernate.dilate=org.hibernate.dialect.MySQL8Dialect

# auto create tables
spring.jpa.hibernate.ddl-auto=update
server.port=0
